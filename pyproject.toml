[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-ultra"
version = "0.1.0"
description = "Hermes Ultra integration layer"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
legal-mcp = ["mcp>=2,<3"]
legal-api = ["fastapi>=0.115,<1"]
legal = ["mcp>=2,<3", "fastapi>=0.115,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
