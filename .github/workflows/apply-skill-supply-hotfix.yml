name: apply-skill-supply-hotfix

on:
  push:
    branches:
      - ai/skill-supply-chain-review-fixes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply review fixes
        run: |
          python scripts/patch_lifecycle_binding.py
          python scripts/patch_supply_identity.py
          python scripts/patch_supply_review_remaining.py
      - name: Install tests
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q src
      - name: Targeted regressions
        run: pytest -q tests/test_skill_supply_chain.py tests/test_skill_supply_chain_review_fixes.py
      - name: Full suite
        run: pytest -q
      - name: Commit verified hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/patch_lifecycle_binding.py scripts/patch_supply_identity.py scripts/patch_supply_review_remaining.py .github/workflows/apply-skill-supply-hotfix.yml
          git add src/hermes_ultra/skill_lifecycle.py src/hermes_ultra/skill_supply_chain.py tests/test_skill_supply_chain.py
          git diff --cached --check
          git commit -m 'fix: close skill supply-chain review races'
          git push origin HEAD:ai/skill-supply-chain-review-fixes
