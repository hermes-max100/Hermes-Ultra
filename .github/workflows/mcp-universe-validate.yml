name: mcp-universe-validate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mcp-universe-validate.yml'
      - '.skills/skills.d/agent-reach/SKILL.md'
      - 'config/mcp-provider-registry.json'
      - 'config/mcp-discovery-sources.json'
      - 'config/tool-registry.json'
      - 'config/production-versions.json'
      - 'src/system/agent-reach.sh'
      - 'src/system/mcp-provider-registry.py'
      - 'src/system/mcp-discovery-governance.py'
      - 'src/system/mcp-provider-router.py'
      - 'src/system/mcp-provider-sync.py'
      - 'src/system/mcp-stateless-gateway.py'
      - 'scripts/ensure-node-runtime.sh'
      - 'scripts/sync-mcp-provider-registry.sh'
      - 'scripts/install-cloud-release-local.sh'
      - 'tests/test_mcp_provider_registry.py'
      - 'tests/test_mcp_discovery_governance.py'
      - 'tests/test_mcp_provider_sync.sh'
      - 'tests/test_node_runtime_prerequisite.sh'
      - 'docs/deployment/mcp-provider-universe.md'
      - 'docs/deployment/mcp-discovery-governance.md'
      - 'docs/superpowers/plans/2026-08-30-mcp-universe-integration.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: MCP discovery governance tests
        run: python3 tests/test_mcp_discovery_governance.py
      - name: MCP provider registry tests
        run: python3 tests/test_mcp_provider_registry.py
      - name: MCP provider sync tests
        run: bash tests/test_mcp_provider_sync.sh
      - name: Node runtime prerequisite test
        run: bash tests/test_node_runtime_prerequisite.sh
      - name: Existing MCP and plugin regressions
        run: |
          python3 tests/test_mcp_stateless_gateway.py
          python3 tests/test_plugin_intake.py
      - name: Static validation
        run: |
          python3 -m json.tool config/mcp-provider-registry.json >/dev/null
          python3 -m json.tool config/mcp-discovery-sources.json >/dev/null
          python3 -m json.tool config/tool-registry.json >/dev/null
          python3 -m json.tool config/production-versions.json >/dev/null
          python3 -m py_compile src/system/mcp-provider-registry.py src/system/mcp-discovery-governance.py src/system/mcp-provider-router.py src/system/mcp-provider-sync.py src/system/mcp-stateless-gateway.py
          bash -n src/system/agent-reach.sh
          bash -n scripts/ensure-node-runtime.sh
          bash -n scripts/sync-mcp-provider-registry.sh
          bash -n scripts/install-cloud-release-local.sh
      - name: Workflow supply-chain regression
        run: python3 tests/test_github_actions_pinning.py
