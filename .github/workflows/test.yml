name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[test]'
      - name: Compile source
        run: python -m compileall -q src
      - name: Full test suite
        run: pytest -q
      - name: Skill lifecycle regression suite
        run: pytest tests/test_skill_lifecycle.py -q
      - name: Autonomy regression suite
        run: pytest tests/test_autonomy.py tests/test_orchestrator_e2e.py -q
      - name: Source secret scan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          patterns = {
              "bearer": re.compile(r"(?i)Bearer\s+[A-Za-z0-9._~+\-/]{16,}"),
              "auth_token": re.compile(r"(?i)auth_token=[A-Za-z0-9._~+\-/]{8,}"),
              "password": re.compile(r"(?i)password\s*[=:]\s*['\"]?[A-Za-z0-9._~+\-/]{8,}"),
          }
          violations = []
          for path in Path("src").rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              for name, pattern in patterns.items():
                  for match in pattern.finditer(text):
                      value = match.group(0)
                      if "REDACTED" not in value:
                          violations.append(f"{path}: {name}")
          if violations:
              print("Potential committed secrets:")
              print("\n".join(violations))
              sys.exit(1)
          PY
      - name: Repository secret scan
        uses: trufflesecurity/trufflehog@0c952ace0f842f11c75775922d7400335cf60bc6
        with:
          path: .
          version: '3.97.1'
