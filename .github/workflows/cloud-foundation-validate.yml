name: cloud-foundation-validate

# Provider-aware validation for the staged Hermes Max cloud foundation.
on:
  push:
    branches:
      - ai/hermes-ultra-release
    paths:
      - '.github/workflows/cloud-foundation-validate.yml'
      - 'infra/**'
      - 'docs/deployment/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/production-versions.json'
      - 'src/system/load-hermes-runtime-env.sh'
      - 'src/system/load-aws-runtime-secrets.sh'
      - 'src/system/orca_execution_backend.py'
  pull_request:
    branches:
      - ai/hermes-ultra-release
    paths:
      - '.github/workflows/cloud-foundation-validate.yml'
      - 'infra/**'
      - 'docs/deployment/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/production-versions.json'
      - 'src/system/load-hermes-runtime-env.sh'
      - 'src/system/load-aws-runtime-secrets.sh'
      - 'src/system/orca_execution_backend.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.6.6

      - name: Static and provider-aware validation
        run: bash scripts/verify-cloud-foundation.sh

      - name: Cloud foundation regression tests
        run: |
          bash tests/test_cloud_foundation.sh
          bash tests/test_load_hermes_runtime_env.sh
          bash tests/test_production_versions.sh
          bash tests/test_release_supply_chain.sh
          bash tests/test_cloud_release_rollback.sh
          bash tests/test_aws_production_preflight.sh
          bash tests/test_stage_hermes_agent_source.sh
          bash tests/test_export_hermes_dependency_locks.sh
          bash tests/test_install_cloud_release_local.sh
          bash tests/test_install_orca_runtime.sh
          bash tests/test_aws_runtime_secrets.sh
          bash tests/test_secret_scan_production.sh
          python3 -m unittest tests.test_orca_execution_backend tests.test_orca_release_integration

      - name: Build deterministic cloud release
        env:
          SOURCE_DATE_EPOCH: 20260815T010000Z
        run: bash scripts/build-cloud-release.sh

      - name: Verify release integrity and exclusions
        run: |
          sha256sum -c dist/*.sha256
          tmp="$(mktemp -d)"
          tar -xzf dist/hermes-max-cloud-20260815T010000Z.tar.gz -C "$tmp"
          cd "$tmp/hermes-max"
          sha256sum -c CLOUD_RELEASE_MANIFEST.sha256 >/dev/null
          test ! -e .codex-project
          test ! -e .hermes
          test ! -e prospects.jsonl
          test ! -e exp_local_service_001-opportunity.json
          ! find infra -type f \( -name terraform.tfvars -o -name '*.auto.tfvars' -o -name 'terraform.tfstate*' \) | grep -q .
