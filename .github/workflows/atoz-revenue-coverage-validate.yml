name: atoz-revenue-coverage-validate

on:
  push:
    branches: ['feat/atoz-revenue-coverage-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Compile AtoZ package
        run: python -m compileall -q src/hermes_ultra/atoz
      - name: Run AtoZ and existing voice regression tests
        run: pytest -q tests/test_voice_revenue_recovery.py tests/test_atoz_revenue_coverage.py
      - name: Exercise benchmark harness without live-provider claims
        run: |
          python scripts/run_atoz_voice_benchmark.py --show-corpus >/tmp/atoz-corpus.json
          python scripts/run_atoz_voice_benchmark.py --observations config/atoz/benchmark-fixture.synthetic.json | tee /tmp/atoz-benchmark.txt
          grep -q '"all_measured_live": false' /tmp/atoz-benchmark.txt
          grep -q 'not a measured provider recommendation' /tmp/atoz-benchmark.txt
