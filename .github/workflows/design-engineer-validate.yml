name: design-engineer-validate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.agents/skills/design-engineer/**'
      - '.agents/skills/web-design-guidelines/**'
      - '.agents/skills/browser-harness-self-healing/**'
      - '.github/workflows/design-engineer-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Validate design-engineer policy and acceptance contract
        run: python3 .agents/skills/design-engineer/validate.py
